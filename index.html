<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hannibal's Playroom</title>
    <style>
        :root {
            --bright-orange: #ff6600;
            --dino-green: #39ff14;
            --sky-blue: #00ccff;
            --mud-brown: #1e1e24;
            --card-bg: #111116;
        }

        body {
            background-color: var(--mud-brown);
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            user-select: none;
        }

        header {
            width: 95%;
            max-width: 950px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #000000;
            border: 3px solid var(--bright-orange);
            border-radius: 10px;
            padding: 15px 20px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        .title-text {
            font-size: 1.6rem;
            color: var(--sky-blue);
            font-weight: bold;
            letter-spacing: 2px;
        }

        .star-tracker {
            font-size: 1.6rem;
            color: #ffd700;
            font-weight: bold;
        }

        #main-stage {
            width: 95%;
            max-width: 950px;
            background: #000000;
            border: 3px solid #ffffff;
            border-radius: 12px;
            min-height: 520px;
            position: relative;
            display: flex;
            flex-direction: column;
            padding: 25px;
            box-sizing: border-box;
        }

        #menu-screen {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            width: 100%;
        }

        /* CHANGED: Swapped cards to authentic HTML button behaviors */
        button.menu-card {
            background: var(--card-bg);
            border: 3px solid #444;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            padding: 30px 10px;
            font-family: inherit;
            color: #ffffff;
            transition: transform 0.2s;
        }

        button.menu-card:hover {
            transform: scale(1.03);
        }

        button.menu-card:active {
            transform: scale(0.98);
        }

        button.menu-card.truck-theme { border-color: var(--bright-orange); }
        button.menu-card.dino-theme { border-color: var(--dino-green); }
        button.menu-card.con-theme { border-color: var(--sky-blue); }

        .shape-badge {
            width: 80px;
            height: 80px;
            margin-bottom: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .badge-circle { background: var(--bright-orange); border-radius: 50%; }
        .badge-triangle { 
            width: 0; height: 0; 
            border-left: 40px solid transparent; 
            border-right: 40px solid transparent; 
            border-bottom: 75px solid var(--dino-green); 
        }
        .badge-square { background: var(--sky-blue); border-radius: 8px; }

        .card-label {
            font-size: 1.2rem;
            font-weight: bold;
            text-align: center;
            letter-spacing: 1px;
            line-height: 1.4;
        }

        .game-view {
            display: none;
            flex-direction: column;
            width: 100%;
        }

        .view-panel {
            height: 220px;
            background: #08080c;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            margin-bottom: 25px;
            border: 2px solid #222;
        }

        .large-display-box {
            width: 100px;
            height: 100px;
            border-radius: 12px;
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .asl-display {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #ffffff;
            border-radius: 8px;
            border: 3px solid var(--dino-green);
            width: 80px;
            height: 80px;
        }

        .action-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            width: 100%;
            margin-top: auto;
        }

        .big-touch-btn {
            background: #11111e;
            border: 3px solid #ffffff;
            border-radius: 12px;
            color: #ffffff;
            padding: 20px 10px;
            font-size: 1.1rem;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 5px 0 #000;
        }

        .big-touch-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #000;
        }

        .btn-indicator {
            width: 20px;
            height: 20px;
            background: #ffffff;
            border-radius: 50%;
            margin-bottom: 10px;
        }

        #home-btn {
            background: #ff3333;
            border: 2px solid #fff;
            border-radius: 8px;
            color: white;
            padding: 8px 16px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            align-self: flex-start;
            margin-bottom: 15px;
            display: none;
        }
    </style>
</head>
<body>

<header>
    <div class="title-text">■ HANNIBAL'S PLAYROOM</div>
    <div class="star-tracker" id="star-count">■ 0 STARS</div>
</header>

<div id="main-stage">
    <button id="home-btn" onclick="returnToMenu()">← GO BACK</button>

    <!-- Main Entry Screen Grid Selection -->
    <div id="menu-screen">
        <button class="menu-card truck-theme" onclick="startLevel('trucks')">
            <div class="shape-badge badge-circle"></div>
            <div class="card-label">MONSTER TRUCK<br>SOUNDS</div>
        </button>
        <button class="menu-card dino-theme" onclick="startLevel('dinos')">
            <div class="shape-badge badge-triangle"></div>
            <div class="card-label">DINOSAUR<br>SIGN LANGUAGE</div>
        </button>
        <button class="menu-card con-theme" onclick="startLevel('construction')">
            <div class="shape-badge badge-square"></div>
            <div class="card-label">CONSTRUCTION<br>COUNTING</div>
        </button>
    </div>

    <!-- LEVEL 1: MONSTER TRUCKS -->
    <div id="level-trucks" class="game-view">
        <div class="view-panel" id="truck-viewport">
            <div class="large-display-box" style="background: var(--bright-orange);"></div>
            <h2 id="truck-status-text" style="margin-top:15px; letter-spacing:1px;">READY TO RUMBLE</h2>
        </div>
        <div class="action-grid">
            <button class="big-touch-btn" style="border-color:var(--bright-orange);" onclick="playPhonics('Ah', '💨 Vroom Ah!')">
                <div class="btn-indicator"></div>
                <span>SPEAK "Ah"</span>
            </button>
            <button class="big-touch-btn" style="border-color:var(--bright-orange);" onclick="playPhonics('Oh', '💥 Crash Oh!')">
                <div class="btn-indicator"></div>
                <span>SPEAK "Oh"</span>
            </button>
            <button class="big-touch-btn" style="border-color:var(--bright-orange);" onclick="playPhonics('Eee', '⚡ Screech Eee!')">
                <div class="btn-indicator"></div>
                <span>SPEAK "Eee"</span>
            </button>
            <button class="big-touch-btn" style="border-color:var(--bright-orange);" onclick="playPhonics('Vroom', '🔥 VROOM VROOM!')">
                <div class="btn-indicator" style="background:red;"></div>
                <span>ENGINE REV</span>
            </button>
        </div>
    </div>

    <!-- LEVEL 2: DINOSAURS -->
    <div id="level-dinos" class="game-view">
        <div class="view-panel">
            <div class="large-display-box" id="dino-center-badge" style="background: var(--dino-green);"></div>
            <div class="asl-display" id="asl-cue-panel"></div>
        </div>
        <div class="action-grid" id="dino-choices"></div>
    </div>

    <!-- LEVEL 3: CONSTRUCTION ZONE -->
    <div id="level-construction" class="game-view">
        <div class="view-panel" id="construction-viewport" style="gap:20px; flex-direction:row;"></div>
        <div class="action-grid" id="construction-choices"></div>
    </div>
</div>

<script>
    let starScore = 0;
    let activeLevel = "";
    let currentDinoTarget = {};
    let currentCountTarget = 0;

    const dinos = [
        { word: "More", color: "#ff00ff", aslColor: "#ff00ff", voice: "More! Give me more!" },
        { word: "Eat", color: "#ffcc00", aslColor: "#ffcc00", voice: "Eat! I am hungry." },
        { word: "Stop", color: "#ff3333", aslColor: "#ff3333", voice: "Stop! Hold on right there." },
        { word: "Help", color: "#00ffff", aslColor: "#00ffff", voice: "Help! Thank you for helping." }
    ];

    function speakText(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 0.80;
            utterance.pitch = 1.1; 
            window.speechSynthesis.speak(utterance);
}
}
function addStar() {
starScore++;
document.getElementById('star-count').innerText = ■ ${starScore} STARS;
speakText("Awesome! You got a star!");
}
function startLevel(type) {
document.getElementById('menu-screen').style.display = 'none';
document.getElementById('home-btn').style.display = 'block';
activeLevel = level-${type};
document.getElementById(activeLevel).style.display = 'flex';
if (type === 'trucks') {
speakText("Monster truck sounds! Press a big button to speak.");
} else if (type === 'dinos') {
setupDinoQuestion();
} else if (type === 'construction') {
setupConstructionQuestion();
}
}
function returnToMenu() {
if(activeLevel) {
document.getElementById(activeLevel).style.display = 'none';
}
document.getElementById('home-btn').style.display = 'none';
document.getElementById('menu-screen').style.display = 'grid';
window.speechSynthesis.cancel();
}
function playPhonics(sound, completeExpression) {
speakText(sound);
document.getElementById('truck-status-text').innerText = completeExpression.toUpperCase();
const vp = document.getElementById('truck-viewport');
vp.style.transform = "translateY(-15px)";
setTimeout(() => {
vp.style.transform = "none";
speakText(completeExpression);
}, 300);
}
function setupDinoQuestion() {
dinoTarget = dinos[Math.floor(Math.random() * dinos.length)];
document.getElementById('asl-cue-panel').style.backgroundColor = dinoTarget.aslColor;
speakText(Find the color matching block for ${dinoTarget.word});
const grid = document.getElementById('dino-choices');
grid.innerHTML = "";
dinos.forEach(item => {
const btn = document.createElement('button');
btn.className = 'big-touch-btn';
btn.style.borderColor = "var(--dino-green)";
btn.innerHTML = <div style="width:30px; height:30px; background:${item.color}; border-radius:4px; margin-bottom:8px;"></div><span>${item.word.toUpperCase()}</span>;
btn.onclick = () => {
if (item.word === dinoTarget.word) {
document.getElementById('dino-center-badge').style.backgroundColor = dinoTarget.color;
speakText(dinoTarget.voice);
addStar();
setTimeout(setupDinoQuestion, 2000);
} else {
speakText(Try again! Find ${dinoTarget.word});
}
};
grid.appendChild(btn);
});
}
function setupConstructionQuestion() {
countTarget = Math.floor(Math.random() * 4) + 1;
const viewport = document.getElementById('construction-viewport');
viewport.innerHTML = "";
for(let i = 0; i < countTarget; i++) {
const block = document.createElement('div');
block.style.width = "60px";
block.style.height = "60px";
block.style.backgroundColor = "var(--sky-blue)";
block.style.borderRadius = "6px";
block.style.cursor = "pointer";
block.onclick = (e) => {
e.stopPropagation();
speakText(${i + 1});
};
viewport.appendChild(block);
}
speakText("How many blocks do you see?");
const choicesGrid = document.getElementById('construction-choices');
choicesGrid.innerHTML = "";
for(let num = 1; num <= 4; num++) {
const btn = document.createElement('button');
btn.className = 'big-touch-btn';
btn.style.borderColor = "var(--sky-blue)";
btn.innerHTML = <span style="font-size:1.6rem;">${num}</span>;
btn.onclick = () => {
if(num === countTarget) {
viewport.innerHTML = "GREAT JOB!";
speakText(Exactly ${countTarget}!);
addStar();
setTimeout(setupConstructionQuestion, 2500);
} else {
speakText("Let's count together! Tap each block.");
}
};
choicesGrid.appendChild(btn);
}
}
