<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hannibal's Playroom</title>
    <style>
        :root {
            --bright-orange: #ff6600;
            --dino-green: #39ff14;
            --sky-blue: #00ccff;
            --mud-brown: #1e1e24;
            --card-bg: #111116;
        }

        body {
            background-color: var(--mud-brown);
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            user-select: none;
        }

        header {
            width: 95%;
            max-width: 950px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #000000;
            border: 3px solid var(--bright-orange);
            border-radius: 10px;
            padding: 15px 20px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        .title-text {
            font-size: 1.6rem;
            color: var(--sky-blue);
            font-weight: bold;
            letter-spacing: 2px;
        }

        .star-tracker {
            font-size: 1.6rem;
            color: #ffd700;
            font-weight: bold;
        }

        #main-stage {
            width: 95%;
            max-width: 950px;
            background: #000000;
            border: 3px solid #ffffff;
            border-radius: 12px;
            min-height: 520px;
            position: relative;
            display: flex;
            flex-direction: column;
            padding: 25px;
            box-sizing: border-box;
        }

        #menu-screen {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            width: 100%;
        }

        .menu-card {
            background: var(--card-bg);
            border: 3px solid #444;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            padding: 30px 10px;
            transition: transform 0.2s;
        }

        .menu-card:hover {
            transform: scale(1.03);
        }

        .menu-card.truck-theme { border-color: var(--bright-orange); }
        .menu-card.dino-theme { border-color: var(--dino-green); }
        .menu-card.con-theme { border-color: var(--sky-blue); }

        .card-img {
            width: 90px;
            height: 90px;
            margin-bottom: 20px;
            image-rendering: pixelated;
        }

        .card-label {
            font-size: 1.2rem;
            font-weight: bold;
            text-align: center;
            letter-spacing: 1px;
            line-height: 1.4;
        }

        .game-view {
            display: none;
            flex-direction: column;
            width: 100%;
        }

        .view-panel {
            height: 220px;
            background: #08080c;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            margin-bottom: 25px;
            border: 2px solid #222;
        }

        .view-panel img {
            height: 140px;
            image-rendering: pixelated;
        }

        .asl-display {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #ffffff;
            padding: 8px;
            border-radius: 8px;
            border: 3px solid var(--dino-green);
            width: 70px;
            height: 70px;
        }

        .action-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            width: 100%;
            margin-top: auto;
        }

        .big-touch-btn {
            background: #11111e;
            border: 3px solid #ffffff;
            border-radius: 12px;
            color: #ffffff;
            padding: 15px 10px;
            font-size: 1.1rem;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 5px 0 #000;
        }

        .big-touch-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #000;
        }

        .btn-img {
            width: 50px;
            height: 50px;
            margin-bottom: 8px;
            image-rendering: pixelated;
        }

        #home-btn {
            background: #ff3333;
            border: 2px solid #fff;
            border-radius: 8px;
            color: white;
            padding: 8px 16px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            align-self: flex-start;
            margin-bottom: 15px;
            display: none;
        }
    </style>
</head>
<body>

<header>
    <div class="title-text">■ HANNIBAL'S PLAYROOM</div>
    <div class="star-tracker" id="star-count">■ 0 STARS</div>
</header>

<div id="main-stage">
    <button id="home-btn" onclick="returnToMenu()">← GO BACK</button>

    <!-- Main Entry Screen -->
    <div id="menu-screen">
        <div class="menu-card truck-theme" onclick="startLevel('trucks')">
            <img class="card-img" src="https://icons8.com" alt="Truck">
            <div class="card-label">MONSTER TRUCK<br>SOUNDS</div>
        </div>
        <div class="menu-card dino-theme" onclick="startLevel('dinos')">
            <img class="card-img" src="https://icons8.com" alt="Dino">
            <div class="card-label">DINOSAUR<br>SIGN LANGUAGE</div>
        </div>
        <div class="menu-card con-theme" onclick="startLevel('construction')">
            <img class="card-img" src="https://icons8.com" alt="Crane">
            <div class="card-label">CONSTRUCTION<br>COUNTING</div>
        </div>
    </div>

    <!-- LEVEL 1: MONSTER TRUCKS -->
    <div id="level-trucks" class="game-view">
        <div class="view-panel" id="truck-viewport">
            <img src="https://icons8.com" alt="Monster Truck Main">
        </div>
        <div class="action-grid">
            <button class="big-touch-btn" style="border-color:var(--bright-orange);" onclick="playPhonics('Ah', '💨 Vroom Ah!')">
                <img class="btn-img" src="https://icons8.com">
                <span>SPEAK "Ah"</span>
            </button>
            <button class="big-touch-btn" style="border-color:var(--bright-orange);" onclick="playPhonics('Oh', '💥 Crash Oh!')">
                <img class="btn-img" src="https://icons8.com">
                <span>SPEAK "Oh"</span>
            </button>
            <button class="big-touch-btn" style="border-color:var(--bright-orange);" onclick="playPhonics('Eee', '⚡ Screech Eee!')">
                <img class="btn-img" src="https://icons8.com">
                <span>SPEAK "Eee"</span>
            </button>
            <button class="big-touch-btn" style="border-color:var(--bright-orange);" onclick="playPhonics('Vroom', '🔥 VROOM VROOM!')">
                <img class="btn-img" src="https://icons8.com">
                <span>TRUCK ENGINE</span>
            </button>
        </div>
    </div>

    <!-- LEVEL 2: DINOSAURS -->
    <div id="level-dinos" class="game-view">
        <div class="view-panel">
            <img id="dino-character" src="https://icons8.com">
            <img class="asl-display" id="asl-cue" src="">
        </div>
        <div class="action-grid" id="dino-choices"></div>
    </div>

    <!-- LEVEL 3: CONSTRUCTION ZONE -->
    <div id="level-construction" class="game-view">
        <div class="view-panel" id="construction-viewport" style="gap:15px;"></div>
        <div class="action-grid" id="construction-choices"></div>
    </div>
</div>

<script>
    let starScore = 0;
    let activeLevel = "";
    let currentDinoTarget = {};
    let currentCountTarget = 0;

    // Direct web-hosted visual assets for the ASL concept blocks
    const dinos = [
        { word: "More", img: "https://icons8.com", asl: "https://icons8.com", voice: "More dinosaur! Give me more!" },
        { word: "Eat", img: "https://icons8.com", asl: "https://icons8.com", voice: "Eat! The dinosaur is hungry." },
        { word: "Stop", img: "https://icons8.com", asl: "https://icons8.com", voice: "Stop! Dinosaur says stop." },
        { word: "Help", img: "https://icons8.com", asl: "https://icons8.com", voice: "Help the tiny dinosaur!" }
    ];

    function speakText(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 0.80;
            utterance.pitch = 1.1; 
            window.speechSynthesis.speak(utterance);
        }
    }

    function addStar() {
        starScore++;
        document.getElementById('star-count').innerText = `■ ${starScore} STARS`;
        speakText("Awesome! You got a star!");
    }

    function startLevel(type) {
        document.getElementById('menu-screen').style.display = 'none';
        document.getElementById('home-btn').style.display = 'block';
        activeLevel = `level-${type}`;
document.getElementById(activeLevel).style.display = 'flex';
if (type === 'trucks') {
speakText("Monster truck rally! Press a big button to make the truck bounce!");
} else if (type === 'dinos') {
setupDinoQuestion();
} else if (type === 'construction') {
setupConstructionQuestion();
}
}
function returnToMenu() {
if(activeLevel) {
document.getElementById(activeLevel).style.display = 'none';
}
document.getElementById('home-btn').style.display = 'none';
document.getElementById('menu-screen').style.display = 'grid';
window.speechSynthesis.cancel();
}
function playPhonics(sound, completeExpression) {
speakText(sound);
const vp = document.getElementById('truck-viewport');
vp.style.transform = "translateY(-20px)";
setTimeout(() => {
vp.style.transform = "none";
speakText(completeExpression);
}, 300);
}
function setupDinoQuestion() {
dinoTarget = dinos[Math.floor(Math.random() * dinos.length)];
document.getElementById('asl-cue').src = dinoTarget.asl;
speakText(Find the word ${dinoTarget.word});
const grid = document.getElementById('dino-choices');
grid.innerHTML = "";
dinos.forEach(item => {
const btn = document.createElement('button');
btn.className = 'big-touch-btn';
btn.style.borderColor = "var(--dino-green)";
btn.innerHTML = <img class="btn-img" src="${item.img}"><span>${item.word.toUpperCase()}</span>;
btn.onclick = () => {
if (item.word === dinoTarget.word) {
speakText(dinoTarget.voice);
addStar();
setTimeout(setupDinoQuestion, 2000);
} else {
speakText(Try again! Find ${dinoTarget.word});
}
};
grid.appendChild(btn);
});
}
function setupConstructionQuestion() {
countTarget = Math.floor(Math.random() * 4) + 1;
const viewport = document.getElementById('construction-viewport');
viewport.innerHTML = "";
for(let i = 0; i < countTarget; i++) {
const img = document.createElement('img');
img.src = "icons8.com";
img.style.cursor = "pointer";
img.onclick = (e) => {
e.stopPropagation();
speakText(${i + 1});
};
viewport.appendChild(img);
}
speakText("How many trucks do you see?");
const choicesGrid = document.getElementById('construction-choices');
choicesGrid.innerHTML = "";
for(let num = 1; num <= 4; num++) {
const btn = document.createElement('button');
btn.className = 'big-touch-btn';
btn.style.borderColor = "var(--sky-blue)";
btn.innerHTML = <span style="font-size:1.8rem; margin-bottom:5px;">${num}</span>;
btn.onclick = () => {
if(num === countTarget) {
viewport.innerHTML = "GREAT JOB!";
speakText(Exactly ${countTarget}!);
addStar();
setTimeout(setupConstructionQuestion, 2500);
} else {
speakText("Count them together! Tap each truck.");
}
};
choicesGrid.appendChild(btn);
}
}
